<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Members</title>
    <link href=https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css rel="stylesheet">
    <!-- <link rel="stylesheet" href="/CSS/accountReg.css"> -->
    <style>
        HTML {
            background-color: white;
        }
    </style>
</head>

<body>
    <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <img src="/images/Group7.ico" width="60" height="60">

            <ul class="navbar-nav ms-4 d-flex flex-row gap-4">
                <li class="nav-item">
                    <a href="/index.HTML" class="nav-link text-white"><strong>Home</strong></a>
                </li>
                <li class="nav-item">
                    <a href="/HTML/news.html#Home" class="nav-link text-white"><strong>Local News</strong></a>
                </li>
                <li class="nav-item">
                    <a href="/HTML/news.html#Sports" class="nav-link text-white"><strong>Sports</strong></a>
                </li>
                <li class="nav-item">
                    <a href="/HTML/news.html#Politics" class="nav-link text-white"><strong>Politics</strong></a>
                </li>
            </ul>

            <select class="form-select w-auto ms-auto"
                    onchange="window.location.href=this.value" id="management">
                <option selected disabled>Account</option>
                <option value="/HTML/accountReg.html">Registration</option>
                <option value="/HTML/login.html">Login</option>
            </select>
        </div>
    </nav>
</header>
<div class="card">
    <div class="container-fluid mt-4 border">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Age</th>
                    <th>Address</th>
                    <th>Password</th>
                </tr>
            </thead>
            <tbody id="memberTable"></tbody>
        </table>
    </div>

    <br>

    <form class = "container-fluid" action="/PHP/memberUpdate.php" name="signupForm" id="signupForm" method="post">
        <h3 class="text-center">Update Existing Account Information</h3>
            <div class="container-md rounded text-center">
                <label for="email">Email to Update:</label>
                <input class="input_email" type="oldEmail" id="oldEmail" name="oldEmail" placeholder="janedoe@example.com" required>
                <br>
            </div>

            <div class="container-md rounded text-center">
                <label for="email">New Email:</label>
                <input class="input_email" type="email" id="email" name="email" placeholder="janedoe@example.com" required>
                <br>
            </div>
            
            <div class="container-md rounded text-center">
                <label for="name" class="text-start">New First and Last Name:</label>
                <input class="input_name" type="name" id="name" name="name" placeholder="Jane Doe" required>
                <br>
            </div>
            
            <div class="container-md rounded text-center">
                <label for="phone" class="text-start">New Phone Number:</label>
                <input class="input_phone" type="phone" id="phone" name="phone" placeholder="123-456-7890" required>
                <br>
            </div>
            
            <div class="container-md rounded text-center">
                <label for="age" class="text-start">New Date of Birth:</label>
                <input class="input_age" type="date" id="age" name="age" required>
                <br>
            </div>

            <div class="container-md rounded text-center">
                <label for="address" class="text-start">New Address:</label>
                <input class="input_address" type="address" id="address" name="address" placeholder="1234 rainbow rd." required>
                <br>
            </div>

            <div class="container-md rounded text-center">
                <label for="password" class="text-start">New Password:</label>
                <input class="input_pass" type="password" id="passwordOriginal" name="password" placeholder="Password" required>
                <br>
            </div>
            
            <div class="container-md rounded text-center">
                <label for="passwordConfirm" class="text-start">Retype New Password:</label>
                <input class="pass_confirm" type="password" id="passwordConfirm" name="password" placeholder="Password" required>
            </div>

        <div class="container-md rounded text-center">
            <input type="submit" value="Update Account" id="update" class="rounded">
        </div>
        <hr class="custom-hr">
    </form>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="/JS/members.js"></script>
    <script src="/JS/validation.js"></script>
    <script src="/JS/userStatus.js"></script>
</div>
</body>
</html>
